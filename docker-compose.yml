name: synker

services:
  synker:
    build: .
    container_name: synker
    restart: unless-stopped
    ports:
      - "3001:3001"
    environment:
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}
      - GOOGLE_REDIRECT_URI=${GOOGLE_REDIRECT_URI:-http://localhost:3001/api/auth/callback}
      - SYNC_INTERVAL=${SYNC_INTERVAL:-5}
      - CALENDAR_IDS=${CALENDAR_IDS:-primary}
      - TASK_LIST_IDS=${TASK_LIST_IDS:-}
      - PORT=3001
      - HTTPS_KEY=${HTTPS_KEY:-}
      - HTTPS_CERT=${HTTPS_CERT:-}
    volumes:
      - ./certs:/certs:ro
    healthcheck:
      test: ["CMD-SHELL", "wget --no-check-certificate -qO- https://127.0.0.1:3001/api/status >/dev/null || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    labels:
      icon: https://raw.githubusercontent.com/joegaffey/synker/main/public/icons/icon-192.svg
      web: https://[ip]:[port:3001]
      name: "Synker"
      description: "Family calendar and task hub synced with Google"
      category: "Productivity"

x-casaos:
  architectures:
    - amd64
    - arm64
  main: synker
  title:
    en_us: Synker
  description:
    en_us: Family calendar and task hub synced with Google Calendar & Tasks
  tagline:
    en_us: Family calendar & tasks
  icon: https://raw.githubusercontent.com/joegaffey/synker/main/public/icons/icon-192.svg
  category: Productivity
  port_map: "3001"
  scheme: https
  index: /

